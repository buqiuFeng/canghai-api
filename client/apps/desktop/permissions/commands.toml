# =============================================================
# 应用自定义命令权限定义（Tauri v2）
# -------------------------------------------------------------
# Tauri v2 应用自身命令不会自动生成 allow-* 权限，需要在此显式声明。
# 每个自定义命令对应一个 identifier = "allow-<command>" 的权限块，
# 通过 commands.allow 列出原始命令函数名（下划线）。
# 声明后即可在 capabilities/default.json 的 permissions 中引用。
# =============================================================

[[permission]]
identifier = "allow-send-http-request"
description = "允许调用 send_http_request 命令"
commands.allow = ["send_http_request"]

